name: check_semantic_pr

on:
  workflow_call:
    secrets:
      GITHUB_BUILD_TOKEN:
        required: true

jobs:
  check_semantic_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Semantic PR
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_BUILD_TOKEN }}
