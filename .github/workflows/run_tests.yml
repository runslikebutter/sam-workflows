name: run_tests

on:
  workflow_call:

jobs:
  run_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app/functions

    steps:
      - name: Checkout Branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        # https://github.com/actions/checkout

      - name: Yarn Install
        run: yarn install

      - name: Run Tests
        run: yarn test
